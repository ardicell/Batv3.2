name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create Clean Project
        run: |
          rm -f build.gradle settings.gradle gradle.properties
          rm -rf app-server .gradle

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          cat > settings.gradle << 'EOF'
          include ':app-server'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          mkdir -p app-server/src/main/kotlin/com/example/server
          mkdir -p app-server/src/main/res/layout
          mkdir -p app-server/src/main/res/drawable
          mkdir -p app-server/src/main/assets

          cat > app-server/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          repositories {
              google()
              mavenCentral()
          }
          android {
              namespace 'com.example.server'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.server"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app-server/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Device Monitor"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".ServerService"
                      android:foregroundServiceType="dataSync" android:exported="false" />
                  <service android:name=".NotificationCollectorService"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <receiver android:name=".BatteryReceiver" android:exported="true" />
              </application>
          </manifest>
          EOF

          cat > app-server/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FF9800" android:pathData="M12,2L2,7l10,5 10,-5 -10,-5zM2,17l10,5 10,-5M2,12l10,5 10,-5"/>
          </vector>
          EOF

          cat > app-server/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:gravity="center" android:orientation="vertical">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Device Monitor Aktif" android:textSize="18sp" />
          </LinearLayout>
          EOF

          # ---------- KOTLIN ----------
          cat > app-server/src/main/kotlin/com/example/server/MainActivity.kt << 'EOF'
          package com.example.server
          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_SMS) != PackageManager.PERMISSION_GRANTED)
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_SMS), 100)
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED)
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_PHONE_STATE), 101)
                  if (!isNotificationListenerEnabled())
                      startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName"))
                          startActivity(i)
                      }
                  }
                  val serviceIntent = Intent(this, ServerService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(serviceIntent)
                  else startService(serviceIntent)
                  Toast.makeText(this, "Server berjalan", Toast.LENGTH_SHORT).show()
                  finish()
              }
              private fun isNotificationListenerEnabled(): Boolean {
                  val flat = Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                  return flat?.contains(packageName) == true
              }
          }
          EOF

          cat > app-server/src/main/kotlin/com/example/server/BatteryReceiver.kt << 'EOF'
          package com.example.server
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.BatteryManager
          object BatteryData {
              var level: Int = 0
              var plugged: String = "None"
              var charging: Boolean = false
              var voltage: Int = 0
              var temperature: Float = 0f
              var current: Int = -1
              var health: String = "Unknown"
          }
          class BatteryReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, 0)
                  val scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, 100)
                  BatteryData.level = (level * 100) / scale
                  val status = intent.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                  BatteryData.charging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL
                  val plugged = intent.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0)
                  BatteryData.plugged = when (plugged) {
                      BatteryManager.BATTERY_PLUGGED_AC -> "AC"
                      BatteryManager.BATTERY_PLUGGED_USB -> "USB"
                      BatteryManager.BATTERY_PLUGGED_WIRELESS -> "Wireless"
                      else -> "None"
                  }
                  BatteryData.voltage = intent.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0)
                  BatteryData.temperature = intent.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) / 10f
                  BatteryData.health = when (intent.getIntExtra(BatteryManager.EXTRA_HEALTH, 0)) {
                      BatteryManager.BATTERY_HEALTH_COLD -> "Cold"
                      BatteryManager.BATTERY_HEALTH_DEAD -> "Dead"
                      BatteryManager.BATTERY_HEALTH_GOOD -> "Good"
                      BatteryManager.BATTERY_HEALTH_OVERHEAT -> "Overheat"
                      BatteryManager.BATTERY_HEALTH_OVER_VOLTAGE -> "Over Voltage"
                      else -> "Unknown"
                  }
                  BatteryData.current = intent.getIntExtra("current_now", -1)
                  if (BatteryData.current == -1) BatteryData.current = intent.getIntExtra("current_avg", -1)
              }
          }
          EOF

          cat > app-server/src/main/kotlin/com/example/server/NotificationCollectorService.kt << 'EOF'
          package com.example.server
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          class NotificationCollectorService : NotificationListenerService() {
              companion object {
                  val notifications = mutableListOf<Map<String, Any>>()
                  const val MAX = 100
              }
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val extras = sbn.notification.extras
                  val title = extras.getString("android.title") ?: ""
                  val text = extras.getString("android.text") ?: ""
                  val map = mapOf("app" to sbn.packageName, "title" to title, "text" to text, "time" to System.currentTimeMillis())
                  synchronized(notifications) {
                      notifications.add(0, map)
                      if (notifications.size > MAX) notifications.removeAt(notifications.size - 1)
                  }
              }
              override fun onNotificationRemoved(sbn: StatusBarNotification?) {}
          }
          EOF

          cat > app-server/src/main/kotlin/com/example/server/SmsHelper.kt << 'EOF'
          package com.example.server
          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.net.Uri
          import androidx.core.content.ContextCompat
          object SmsData {
              var unreadCount: Int = 0
              var lastSender: String = ""
              var lastBody: String = ""
          }
          fun loadSmsData(context: Context) {
              if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_SMS) != PackageManager.PERMISSION_GRANTED) return
              val cursor = context.contentResolver.query(Uri.parse("content://sms/inbox"), arrayOf("address", "body", "read", "date"), "read = 0", null, "date DESC")
              cursor?.use {
                  SmsData.unreadCount = it.count
                  if (it.moveToFirst()) {
                      SmsData.lastSender = it.getString(it.getColumnIndexOrThrow("address"))
                      SmsData.lastBody = it.getString(it.getColumnIndexOrThrow("body"))
                  }
              }
          }
          fun getAllSms(context: Context): List<Map<String, Any>> {
              val list = mutableListOf<Map<String, Any>>()
              if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_SMS) != PackageManager.PERMISSION_GRANTED) return list
              val cursor = context.contentResolver.query(Uri.parse("content://sms/inbox"), arrayOf("address", "body", "read", "date"), null, null, "date DESC")
              cursor?.use {
                  while (it.moveToNext()) {
                      list.add(mapOf(
                          "address" to it.getString(it.getColumnIndexOrThrow("address")),
                          "body" to it.getString(it.getColumnIndexOrThrow("body")),
                          "date" to it.getLong(it.getColumnIndexOrThrow("date")),
                          "read" to (it.getInt(it.getColumnIndexOrThrow("read")) == 1)
                      ))
                  }
              }
              return list
          }
          EOF

          cat > app-server/src/main/kotlin/com/example/server/DataUsageManager.kt << 'EOF'
          package com.example.server
          import android.net.TrafficStats
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.*
          class DataUsageManager(private val storageFile: File) {
              data class UsageEntry(val date: String, val rx: Long, val tx: Long)
              private val dateFormat = SimpleDateFormat("yyyy-MM-dd", Locale.US)
              private val baselineFile = File(storageFile.parent, "baseline.json")
              private var baselineRx = 0L
              private var baselineTx = 0L

              init {
                  loadBaseline()
              }

              private fun loadBaseline() {
                  if (baselineFile.exists()) {
                      val json = JSONObject(baselineFile.readText())
                      baselineRx = json.getLong("rx")
                      baselineTx = json.getLong("tx")
                  } else {
                      baselineRx = TrafficStats.getMobileRxBytes()
                      baselineTx = TrafficStats.getMobileTxBytes()
                      saveBaseline()
                  }
              }

              private fun saveBaseline() {
                  val json = JSONObject().apply {
                      put("rx", baselineRx)
                      put("tx", baselineTx)
                  }
                  baselineFile.writeText(json.toString())
              }

              fun loadEntries(): MutableList<UsageEntry> {
                  if (!storageFile.exists()) return mutableListOf()
                  val json = storageFile.readText()
                  val arr = JSONArray(json)
                  val list = mutableListOf<UsageEntry>()
                  for (i in 0 until arr.length()) {
                      val obj = arr.getJSONObject(i)
                      list.add(UsageEntry(obj.getString("date"), obj.getLong("rx"), obj.getLong("tx")))
                  }
                  return list
              }

              fun saveEntries(entries: List<UsageEntry>) {
                  val arr = JSONArray()
                  for (e in entries) {
                      arr.put(JSONObject().apply {
                          put("date", e.date)
                          put("rx", e.rx)
                          put("tx", e.tx)
                      })
                  }
                  storageFile.writeText(arr.toString())
              }

              fun recordDailySnapshot() {
                  val today = dateFormat.format(Date())
                  val totalRx = TrafficStats.getMobileRxBytes()
                  val totalTx = TrafficStats.getMobileTxBytes()
                  val entries = loadEntries().toMutableList()
                  if (entries.none { it.date == today }) {
                      entries.add(UsageEntry(today, totalRx, totalTx))
                  } else {
                      val idx = entries.indexOfFirst { it.date == today }
                      entries[idx] = UsageEntry(today, totalRx, totalTx)
                  }
                  saveEntries(entries)
              }

              fun getLifetimeUsage(): UsageEntry {
                  val totalRx = TrafficStats.getMobileRxBytes()
                  val totalTx = TrafficStats.getMobileTxBytes()
                  return UsageEntry("lifetime", totalRx - baselineRx, totalTx - baselineTx)
              }

              fun getDailyList(): List<UsageEntry> {
                  val entries = loadEntries().sortedByDescending { it.date }
                  val result = mutableListOf<UsageEntry>()
                  var prevRx = baselineRx
                  var prevTx = baselineTx
                  for (entry in entries) {
                      val dailyRx = entry.rx - prevRx
                      val dailyTx = entry.tx - prevTx
                      if (dailyRx > 0 || dailyTx > 0) {
                          result.add(UsageEntry(entry.date, dailyRx, dailyTx))
                      }
                      prevRx = entry.rx
                      prevTx = entry.tx
                  }
                  return result
              }
          }
          EOF

          cat > app-server/src/main/kotlin/com/example/server/DataServer.kt << 'KOTLINEOF'
          package com.example.server

          import android.content.Context
          import android.content.Context.TELEPHONY_SERVICE
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.TrafficStats
          import android.os.Build
          import android.telephony.TelephonyManager
          import fi.iki.elonen.NanoHTTPD
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.BufferedReader
          import java.io.InputStreamReader

          class DataServer(private val context: Context, port: Int) : NanoHTTPD(port) {
              private val usageManager = DataUsageManager(File(context.filesDir, "data_usage.json"))
              private var lastRxBytes = TrafficStats.getMobileRxBytes()
              private var lastTxBytes = TrafficStats.getMobileTxBytes()
              private var lastTrafficTime = System.currentTimeMillis()

              override fun serve(session: IHTTPSession): Response {
                  return when (session.uri) {
                      "/", "/index.html" -> servePage("index.html")
                      "/status" -> jsonResponse(buildStatusJson())
                      "/traffic" -> jsonResponse(getTrafficNowJson())
                      "/data_usage" -> jsonResponse(getDataUsageJson())
                      "/notifications" -> jsonResponse(getNotificationsJson())
                      "/sms" -> jsonResponse(getSmsJson())
                      "/signal" -> jsonResponse(getSignalJson())
                      "/cpu_ram" -> jsonResponse(getCpuRamJson())
                      else -> servePage(session.uri.removePrefix("/"))
                  }
              }

              private fun servePage(path: String): Response {
                  return try {
                      val assetPath = if (path.isEmpty()) "index.html" else path
                      val stream = context.assets.open(assetPath)
                      val text = BufferedReader(InputStreamReader(stream)).readText()
                      stream.close()
                      val mime = when {
                          assetPath.endsWith(".html") -> "text/html"
                          assetPath.endsWith(".css") -> "text/css"
                          assetPath.endsWith(".js") -> "application/javascript"
                          else -> "text/plain"
                      }
                      newFixedLengthResponse(Response.Status.OK, mime, text)
                  } catch (e: Exception) {
                      newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "Not Found")
                  }
              }

              private fun jsonResponse(json: String) = newFixedLengthResponse(Response.Status.OK, "application/json", json)

              private fun buildStatusJson(): String {
                  val battery = JSONObject().apply {
                      put("level", BatteryData.level)
                      put("plugged", BatteryData.plugged)
                      put("charging", BatteryData.charging)
                      put("voltage", BatteryData.voltage)
                      put("temperature", BatteryData.temperature)
                      put("current", BatteryData.current)
                      put("health", BatteryData.health)
                  }
                  val sms = JSONObject().apply {
                      put("unread_count", SmsData.unreadCount)
                      put("last_sender", SmsData.lastSender)
                      put("last_body", SmsData.lastBody)
                  }
                  return JSONObject().apply {
                      put("battery", battery)
                      put("sms", sms)
                      put("timestamp", System.currentTimeMillis())
                      val cpuTemp = getCpuTemperature()
                      if (cpuTemp != null) put("cpu_temperature", cpuTemp)
                      val current = if (BatteryData.current <= 0) getChargeCurrentFromFile() else BatteryData.current
                      if (current > 0) put("charge_current", current)
                  }.toString()
              }

              private fun getTrafficNowJson(): String {
                  val nowRx = TrafficStats.getMobileRxBytes()
                  val nowTx = TrafficStats.getMobileTxBytes()
                  val now = System.currentTimeMillis()
                  val deltaTime = ((now - lastTrafficTime) / 1000.0).coerceAtLeast(0.1)
                  val rxSpeed = ((nowRx - lastRxBytes) / deltaTime).toLong()
                  val txSpeed = ((nowTx - lastTxBytes) / deltaTime).toLong()
                  lastRxBytes = nowRx
                  lastTxBytes = nowTx
                  lastTrafficTime = now
                  return JSONObject().apply {
                      put("rx_speed", rxSpeed)
                      put("tx_speed", txSpeed)
                  }.toString()
              }

              private fun getDataUsageJson(): String {
                  val lifetime = usageManager.getLifetimeUsage()
                  val daily = usageManager.getDailyList()
                  val dailyArr = JSONArray()
                  for (d in daily) {
                      dailyArr.put(JSONObject().apply {
                          put("date", d.date)
                          put("rx", d.rx)
                          put("tx", d.tx)
                      })
                  }
                  return JSONObject().apply {
                      put("lifetime_rx", lifetime.rx)
                      put("lifetime_tx", lifetime.tx)
                      put("daily", dailyArr)
                  }.toString()
              }

              private fun getNotificationsJson(): String {
                  val arr = JSONArray()
                  synchronized(NotificationCollectorService.notifications) {
                      for (n in NotificationCollectorService.notifications) {
                          arr.put(JSONObject(n))
                      }
                  }
                  return arr.toString()
              }

              private fun getSmsJson(): String {
                  val list = getAllSms(context)
                  val arr = JSONArray()
                  for (msg in list) {
                      arr.put(JSONObject(msg))
                  }
                  return arr.toString()
              }

              private fun getSignalJson(): String {
                  return try {
                      val tm = context.getSystemService(TELEPHONY_SERVICE) as? TelephonyManager
                      val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as? ConnectivityManager
                      val nc = cm?.activeNetwork?.let { cm.getNetworkCapabilities(it) }
                      val type = when {
                          nc?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true -> "WiFi"
                          nc?.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) == true -> "Mobile"
                          else -> "Unknown"
                      }
                      val networkType = when (tm?.networkType) {
                          1 -> "GPRS"; 2 -> "EDGE"; 3 -> "UMTS"
                          4 -> "CDMA"; 5 -> "EVDO"; 6 -> "1xRTT"
                          7 -> "HSDPA"; 8 -> "HSUPA"; 9 -> "HSPA"
                          10 -> "HSPA+"; 13 -> "LTE"; 20 -> "NR"
                          else -> "Unknown"
                      }
                      val signalStrength = try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              tm?.signalStrength?.level
                          } else {
                              @Suppress("DEPRECATION")
                              tm?.signalStrength?.level
                          }
                      } catch (e: SecurityException) { -1 } ?: -1
                      val operator = tm?.networkOperatorName ?: "N/A"
                      JSONObject().apply {
                          put("type", type)
                          put("network", networkType)
                          put("signal_level", signalStrength)
                          put("operator", operator)
                          put("dbm", getDbm(signalStrength))
                          put("error", false)
                      }.toString()
                  } catch (e: Exception) {
                      JSONObject().apply {
                          put("error", true)
                          put("message", "Izin tidak diberikan atau data tidak tersedia")
                      }.toString()
                  }
              }

              private fun getDbm(level: Int): Int {
                  return when (level) {
                      0 -> -105; 1 -> -95; 2 -> -85; 3 -> -75; 4 -> -65
                      else -> -999
                  }
              }

              private fun getCpuRamJson(): String {
                  val memInfo = getMemInfo()
                  val cpuUsage = getCpuUsage()
                  return JSONObject().apply {
                      put("ram_total", memInfo.first)
                      put("ram_available", memInfo.second)
                      put("ram_used", memInfo.first - memInfo.second)
                      put("cpu_percent", cpuUsage)
                  }.toString()
              }

              private fun getMemInfo(): Pair<Long, Long> {
                  try {
                      val reader = BufferedReader(InputStreamReader(File("/proc/meminfo").inputStream()))
                      var total = 0L
                      var avail = 0L
                      reader.forEachLine { line ->
                          when {
                              line.startsWith("MemTotal:") -> total = line.split("\\s+".toRegex())[1].toLong()
                              line.startsWith("MemAvailable:") -> avail = line.split("\\s+".toRegex())[1].toLong()
                          }
                      }
                      reader.close()
                      return Pair(total, avail)
                  } catch (e: Exception) { return Pair(0, 0) }
              }

              private fun getCpuUsage(): Int {
                  try {
                      val reader = BufferedReader(InputStreamReader(File("/proc/stat").inputStream()))
                      val firstLine = reader.readLine()
                      reader.close()
                      val parts = firstLine.split("\\s+".toRegex()).filter { it.isNotEmpty() }
                      if (parts.size >= 5) {
                          val total = parts.drop(1).sumOf { it.toLong() }
                          val idle = parts[4].toLong()
                          return ((total - idle).toDouble() / total * 100).toInt().coerceIn(0, 100)
                      }
                  } catch (e: Exception) {}
                  return 0
              }

              private fun getCpuTemperature(): Float? {
                  return try {
                      val f = File("/sys/devices/virtual/thermal/thermal_zone0/temp")
                      if (f.exists()) f.readText().trim().toFloat() / 1000f else null
                  } catch (e: Exception) { null }
              }

              private fun getChargeCurrentFromFile(): Int {
                  for (path in listOf(
                      "/sys/class/power_supply/battery/current_now",
                      "/sys/class/power_supply/battery/batt_current",
                      "/sys/class/power_supply/battery/current_avg"
                  )) {
                      try {
                          val f = File(path)
                          if (f.exists()) return Math.abs(f.readText().trim().toInt()) / 1000
                      } catch (_: Exception) {}
                  }
                  return -1
              }
          }
          KOTLINEOF

          cat > app-server/src/main/kotlin/com/example/server/ServerService.kt << 'EOF'
          package com.example.server
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import androidx.core.app.NotificationCompat
          import java.util.*
          class ServerService : android.app.Service() {
              private var server: DataServer? = null
              private lateinit var batteryReceiver: BatteryReceiver
              private val handler = Handler(Looper.getMainLooper())
              private var activePort = 8080
              private val dataUsageManager by lazy { DataUsageManager(File(filesDir, "data_usage.json")) }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  batteryReceiver = BatteryReceiver()
                  registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  tryStartServer(80)
                  handler.post(updateSmsRunnable)
                  scheduleDailySnapshot()
              }

              private fun tryStartServer(port: Int) {
                  try {
                      server = DataServer(this, port)
                      server!!.start()
                      activePort = port
                  } catch (e: Exception) {
                      if (port == 80) tryStartServer(8080)
                      return
                  }
                  startForeground(1, buildNotification())
              }

              private fun scheduleDailySnapshot() {
                  val calendar = Calendar.getInstance(TimeZone.getTimeZone("Asia/Jakarta"))
                  calendar.set(Calendar.HOUR_OF_DAY, 0)
                  calendar.set(Calendar.MINUTE, 0)
                  calendar.set(Calendar.SECOND, 0)
                  calendar.set(Calendar.MILLISECOND, 0)
                  if (calendar.timeInMillis <= System.currentTimeMillis()) {
                      calendar.add(Calendar.DAY_OF_YEAR, 1)
                  }
                  val delay = calendar.timeInMillis - System.currentTimeMillis()
                  handler.postDelayed(dailyRunnable, delay)
              }

              private val dailyRunnable = object : Runnable {
                  override fun run() {
                      dataUsageManager.recordDailySnapshot()
                      scheduleDailySnapshot()
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onDestroy() {
                  server?.stop()
                  unregisterReceiver(batteryReceiver)
                  handler.removeCallbacks(updateSmsRunnable)
                  handler.removeCallbacks(dailyRunnable)
                  super.onDestroy()
              }
              override fun onBind(intent: Intent?): IBinder? = null

              private val updateSmsRunnable = object : Runnable {
                  override fun run() {
                      loadSmsData(this@ServerService)
                      handler.postDelayed(this, 30_000)
                  }
              }

              private fun buildNotification() = NotificationCompat.Builder(this, "server_channel")
                  .setContentTitle("Device Monitor Aktif")
                  .setContentText("Akses http://192.168.43.1${if (activePort == 80) "" else ":$activePort"}")
                  .setSmallIcon(android.R.drawable.ic_menu_info_details)
                  .setOngoing(true)
                  .build()

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(NotificationChannel("server_channel", "Server Service", NotificationManager.IMPORTANCE_LOW))
                  }
              }
          }
          EOF

