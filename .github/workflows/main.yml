              .battery-circle { width: 140px; height: 140px; margin: 0 auto 16px; position: relative; }
              .battery-inner { position: absolute; top: 10px; left: 10px; width: 120px; height: 120px; border-radius: 50%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
              .battery-percent { font-size: 36px; font-weight: bold; color: #333; }
              .battery-status { font-size: 12px; color: #666; }
              .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
              .row:last-child { border-bottom: none; }
              .label { color: #555; }
              .value { font-weight: 600; }
              .speed-row { display: flex; gap: 16px; }
              .speed-item { flex: 1; text-align: center; }
              .speed-value { font-size: 20px; font-weight: bold; }
              .speed-unit { font-size: 11px; color: #888; }
              .list-item { padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
              .list-item:last-child { border-bottom: none; }
              .list-item .app { font-weight: bold; }
              .list-item .time { font-size: 11px; color: #888; }
              .detail-text { white-space: pre-wrap; margin-top: 4px; font-size: 13px; color: #444; }
              .data-box { text-align: center; padding: 16px; }
              .data-number { font-size: 28px; font-weight: bold; }
              .data-label { font-size: 12px; color: #888; }
              .table { width: 100%; border-collapse: collapse; margin-top: 12px; }
              .table th, .table td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
              .table th { font-size: 12px; color: #888; }
              .refresh-info { text-align: center; font-size: 11px; color: #aaa; margin-top: 8px; }
          </style>
          </head>
          <body>
          <nav class="nav" id="nav">
              <a href="#" data-page="home" class="active">🏠 Beranda</a>
              <a href="#" data-page="data">📊 Data</a>
              <a href="#" data-page="signal">📶 Sinyal</a>
              <a href="#" data-page="cpuram">⚙️ CPU/RAM</a>
              <a href="#" data-page="notif">🔔 Notif</a>
              <a href="#" data-page="sms">💬 SMS</a>
          </nav>
          <div class="content" id="content">
              <!-- Beranda -->
              <div class="page active" id="page-home">
                  <div class="card" style="text-align:center;">
                      <div class="battery-circle">
                          <svg width="140" height="140" viewBox="0 0 140 140">
                              <circle cx="70" cy="70" r="60" fill="none" stroke="#e0e0e0" stroke-width="8"/>
                              <circle cx="70" cy="70" r="60" fill="none" stroke="#4caf50" stroke-width="8" stroke-dasharray="0" stroke-dashoffset="0" id="battery-arc" transform="rotate(-90 70 70)"/>
                          </svg>
                          <div class="battery-inner">
                              <span class="battery-percent" id="bat-percent">--%</span>
                              <span class="battery-status" id="bat-status-text">--</span>
                          </div>
                      </div>
                      <div class="row"><span class="label">Tegangan</span><span class="value" id="bat-voltage">-- V</span></div>
                      <div class="row"><span class="label">Suhu Baterai</span><span class="value" id="bat-temp">--°C</span></div>
                      <div class="row"><span class="label">Suhu CPU</span><span class="value" id="cpu-temp">--°C</span></div>
                      <div class="row"><span class="label">Charger</span><span class="value" id="bat-plugged">--</span></div>
                      <div class="row"><span class="label">Kecepatan Charger</span><span class="value" id="bat-current">--</span></div>
                  </div>
                  <div class="card">
                      <h3 style="margin-bottom:12px;">📶 Trafik Sekarang</h3>
                      <div class="speed-row">
                          <div class="speed-item"><div class="speed-value" id="speed-down">--</div><div class="speed-unit">Download</div></div>
                          <div class="speed-item"><div class="speed-value" id="speed-up">--</div><div class="speed-unit">Upload</div></div>
                      </div>
                  </div>
                  <div class="refresh-info">Diperbarui setiap 2 detik</div>
              </div>

              <!-- Data Usage -->
              <div class="page" id="page-data">
                  <div class="card">
                      <h3 style="margin-bottom:12px;">📊 Penggunaan Data</h3>
                      <div class="data-box">
                          <div class="data-label">Lifetime Download</div>
                          <div class="data-number" id="lifetime-down">--</div>
                          <div class="data-label">Lifetime Upload</div>
                          <div class="data-number" id="lifetime-up">--</div>
                      </div>
                      <h4 style="margin-top:16px;">📅 Riwayat Harian</h4>
                      <table class="table" id="daily-table">
                          <thead><tr><th>Tanggal</th><th>Download</th><th>Upload</th></tr></thead>
                          <tbody></tbody>
                      </table>
                  </div>
              </div>

              <!-- Sinyal -->
              <div class="page" id="page-signal">
                  <div class="card">
                      <h3 style="margin-bottom:12px;">📶 Sinyal Jaringan</h3>
                      <div id="signal-container">Memuat...</div>
                  </div>
              </div>

              <!-- CPU/RAM -->
              <div class="page" id="page-cpuram">
                  <div class="card">
                      <h3 style="margin-bottom:12px;">⚙️ CPU & RAM</h3>
                      <div id="cpuram-container">Memuat...</div>
                  </div>
              </div>

              <!-- Notifikasi -->
              <div class="page" id="page-notif">
                  <div class="card">
                      <h3 style="margin-bottom:12px;">🔔 Notifikasi</h3>
                      <div id="notif-container">Memuat...</div>
                  </div>
              </div>

              <!-- SMS -->
              <div class="page" id="page-sms">
                  <div class="card">
                      <h3 style="margin-bottom:12px;">💬 SMS</h3>
                      <div id="sms-container">Memuat...</div>
                  </div>
              </div>
          </div>

          <script>
              // Navigasi
              const nav = document.getElementById('nav');
              const pages = document.querySelectorAll('.page');
              nav.addEventListener('click', function(e) {
                  if (e.target.tagName === 'A') {
                      e.preventDefault();
                      const page = e.target.dataset.page;
                      document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
                      e.target.classList.add('active');
                      pages.forEach(p => p.classList.remove('active'));
                      document.getElementById('page-' + page).classList.add('active');
                      if (page === 'signal') loadSignal();
                      else if (page === 'cpuram') loadCpuRam();
                      else if (page === 'notif') loadNotifications();
                      else if (page === 'sms') loadSms();
                      else if (page === 'data') loadDataUsage();
                  }
              });

              function formatBytes(bytes) {
                  if (bytes == null || bytes === 0) return '0 B';
                  const k = 1024;
                  const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                  const i = Math.floor(Math.log(bytes) / Math.log(k));
                  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
              }

              function formatSpeed(bytesPerSec) {
                  if (bytesPerSec == null || bytesPerSec === 0) return '0 B/s';
                  const k = 1024;
                  const sizes = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
                  const i = Math.floor(Math.log(bytesPerSec) / Math.log(k));
                  return parseFloat((bytesPerSec / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
              }

              function updateBatteryArc(level) {
                  const arc = document.getElementById('battery-arc');
                  const r = 60;
                  const circumference = 2 * Math.PI * r;
                  const offset = circumference - (level / 100) * circumference;
                  arc.setAttribute('stroke-dasharray', circumference.toString());
                  arc.setAttribute('stroke-dashoffset', offset.toString());
                  arc.setAttribute('stroke', level < 20 ? '#e53935' : '#4caf50');
              }

              async function loadStatus() {
                  try {
                      const res = await fetch('/status');
                      const data = await res.json();
                      const bat = data.battery;
                      document.getElementById('bat-percent').textContent = bat.level + '%';
                      document.getElementById('bat-status-text').textContent = bat.charging ? 'Mengisi' : 'Baterai';
                      document.getElementById('bat-voltage').textContent = (bat.voltage/1000).toFixed(2) + ' V';
                      document.getElementById('bat-temp').textContent = bat.temperature + '°C';
                      document.getElementById('cpu-temp').textContent = data.cpu_temperature ? data.cpu_temperature + '°C' : '--';
                      document.getElementById('bat-plugged').textContent = bat.plugged;
                      document.getElementById('bat-current').textContent = data.charge_current ? data.charge_current + ' mA' : 'Tidak diketahui';
                      updateBatteryArc(bat.level);
                  } catch(e) { console.error(e); }
              }

              async function loadTraffic() {
                  try {
                      const res = await fetch('/traffic');
                      const data = await res.json();
                      document.getElementById('speed-down').textContent = formatSpeed(data.rx_speed);
                      document.getElementById('speed-up').textContent = formatSpeed(data.tx_speed);
                  } catch(e) {}
              }

              async function loadDataUsage() {
                  try {
                      const res = await fetch('/data_usage');
                      const data = await res.json();
                      document.getElementById('lifetime-down').textContent = formatBytes(data.lifetime_rx);
                      document.getElementById('lifetime-up').textContent = formatBytes(data.lifetime_tx);
                      const tbody = document.querySelector('#daily-table tbody');
                      tbody.innerHTML = '';
                      if (data.daily && data.daily.length) {
                          data.daily.forEach(function(d) {
                              const row = tbody.insertRow();
                              row.insertCell().textContent = d.date;
                              row.insertCell().textContent = formatBytes(d.rx);
                              row.insertCell().textContent = formatBytes(d.tx);
                          });
                      } else {
                          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Belum ada data harian</td></tr>';
                      }
                  } catch(e) {}
              }

              async function loadSignal() {
                  const container = document.getElementById('signal-container');
                  try {
                      const res = await fetch('/signal');
                      const data = await res.json();
                      if (data.error) {
                          container.innerHTML = '<p>Data sinyal tidak tersedia: ' + data.message + '</p>';
                      } else {
                          container.innerHTML =
                              '<div class="row"><span class="label">Tipe</span><span class="value">' + data.type + '</span></div>' +
                              '<div class="row"><span class="label">Jaringan</span><span class="value">' + data.network + '</span></div>' +
                              '<div class="row"><span class="label">Operator</span><span class="value">' + data.operator + '</span></div>' +
                              '<div class="row"><span class="label">Kekuatan</span><span class="value">' + data.signal_level + '/4</span></div>' +
                              '<div class="row"><span class="label">dBm</span><span class="value">' + data.dbm + ' dBm</span></div>';
                      }
                  } catch(e) {
                      container.innerHTML = '<p>Gagal memuat data sinyal.</p>';
                  }
              }

              async function loadCpuRam() {
                  const container = document.getElementById('cpuram-container');
                  try {
                      const res = await fetch('/cpu_ram');
                      const data = await res.json();
                      container.innerHTML =
                          '<div class="row"><span class="label">CPU</span><span class="value">' + data.cpu_percent + '%</span></div>' +
                          '<div class="row"><span class="label">RAM Total</span><span class="value">' + (data.ram_total/1024).toFixed(0) + ' MB</span></div>' +
                          '<div class="row"><span class="label">RAM Terpakai</span><span class="value">' + (data.ram_used/1024).toFixed(0) + ' MB</span></div>' +
                          '<div class="row"><span class="label">RAM Tersedia</span><span class="value">' + (data.ram_available/1024).toFixed(0) + ' MB</span></div>';
                  } catch(e) {
                      container.innerHTML = '<p>Gagal memuat data CPU/RAM.</p>';
                  }
              }

              async function loadNotifications() {
                  try {
                      const res = await fetch('/notifications');
                      const data = await res.json();
                      const container = document.getElementById('notif-container');
                      if (!Array.isArray(data) || data.length === 0) {
                          container.innerHTML = '<p>Tidak ada notifikasi.</p>';
                          return;
                      }
                      let html = '';
                      data.forEach(function(n) {
                          html += '<div class="list-item"><span class="app">' + n.app + '</span> - <span class="time">' + new Date(n.time).toLocaleString() + '</span><br>' + n.title + '<div class="detail-text">' + (n.text || '') + '</div></div>';
                      });
                      container.innerHTML = html;
                  } catch(e) {}
              }

              async function loadSms() {
                  try {
                      const res = await fetch('/sms');
                      const data = await res.json();
                      const container = document.getElementById('sms-container');
                      if (!Array.isArray(data) || data.length === 0) {
                          container.innerHTML = '<p>Tidak ada SMS.</p>';
                          return;
                      }
                      let html = '';
                      data.forEach(function(msg) {
                          const date = new Date(msg.date);
                          html += '<div class="list-item"><strong>' + msg.address + '</strong> <span class="time">' + date.toLocaleString() + '</span><div class="detail-text">' + msg.body + '</div></div>';
                      });
                      container.innerHTML = html;
                  } catch(e) {}
              }

              // Inisialisasi
              loadStatus();
              loadTraffic();
              updateBatteryArc(0);

              setInterval(loadStatus, 2000);
              setInterval(loadTraffic, 2000);
          </script>
          </body>
          </html>
          HTMLEOF

